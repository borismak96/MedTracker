<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PillPal Medical Card · 藥伴伴醫療卡</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0f3d38">
  <style>
    :root {
      --mint: #1aa89a;
      --mint-dark: #0f3d38;
      --mint-text: #c8efe8;
      --card: #fff;
      --text: #16302c;
      --muted: #4d6b66;
      --line: #d5ece7;
      --warn: #fff7ed;
      --warn-edge: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
        "Noto Sans TC", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--mint-dark);
      color: var(--text);
    }
    .wrap { width: min(40rem, calc(100% - 28px)); margin: 0 auto; padding: 1.15rem 0 2rem; }
    header.hero { color: #fff; padding: .35rem 0 1rem; }
    .kicker {
      display: inline-block;
      background: rgba(255,255,255,.12);
      color: var(--mint-text);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: .35rem .6rem;
      border-radius: 999px;
      margin-bottom: .7rem;
    }
    h1 { margin: 0; font-size: clamp(1.55rem, 5vw, 2rem); letter-spacing: -.03em; line-height: 1.15; }
    h1 small { display: block; margin-top: .28rem; font-size: .95rem; font-weight: 650; color: var(--mint-text); }
    .disclaimer {
      margin: .85rem 0 0;
      padding: .75rem .85rem;
      background: rgba(255,255,255,.08);
      border-radius: 12px;
      color: #e7f7f3;
      font-size: .86rem;
      font-weight: 600;
      line-height: 1.45;
    }
    .card {
      background: var(--card);
      border-radius: 22px;
      padding: 1.05rem 1.05rem 1.15rem;
      box-shadow: 0 16px 40px rgba(0,0,0,.18);
    }
    .sec { margin: 0 0 1.05rem; }
    .sec:last-child { margin-bottom: 0; }
    .lab {
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: #127a71;
    }
    .val { margin-top: .28rem; font-size: 1.18rem; font-weight: 750; line-height: 1.35; }
    .sub { margin-top: .15rem; color: var(--muted); font-size: .95rem; font-weight: 600; }
    .warn {
      background: var(--warn);
      border-left: 5px solid var(--warn-edge);
      border-radius: 0 14px 14px 0;
      padding: .8rem .9rem;
    }
    .warn .lab { color: #9a5800; }
    a.phone { color: #0f766e; text-decoration: none; }
    .med {
      display: flex;
      justify-content: space-between;
      gap: .75rem;
      padding: .65rem 0;
      border-bottom: 1px solid var(--line);
    }
    .med:last-child { border-bottom: 0; padding-bottom: 0; }
    .med strong { font-size: 1.05rem; }
    .med span { color: var(--muted); font-weight: 650; white-space: nowrap; }
    .empty { color: var(--muted); font-weight: 650; font-size: 1rem; }
    .note { color: var(--mint-text); font-size: .8rem; margin: 1rem 2px 0; line-height: 1.45; }
    .idle h1 small { color: var(--mint-text); }
    .idle .card p { margin: 0 0 .75rem; color: #23423e; }
    .idle .card p:last-child { margin-bottom: 0; }
    .err { background: #fff1f2; color: #9f1239; font-weight: 700; }
  </style>
</head>
<body>
  <main class="wrap" id="app"></main>
  <script>
(function () {
  var app = document.getElementById("app");

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function section(labelEN, labelZH, valueNode, extraClass) {
    var sec = el("section", "sec" + (extraClass ? " " + extraClass : ""));
    sec.appendChild(el("div", "lab", labelEN + " · " + labelZH));
    sec.appendChild(valueNode);
    return sec;
  }

  function emptyValue() {
    return el("div", "val empty", "Not recorded yet · 尚未記錄");
  }

  function decodeBase64URL(raw) {
    var s = raw.replace(/-/g, "+").replace(/_/g, "/");
    var pad = (4 - s.length % 4) % 4;
    if (pad) s += "===".slice(0, pad);
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (typeof TextDecoder !== "undefined") {
      return new TextDecoder("utf-8").decode(bytes);
    }
    return decodeURIComponent(escape(bin));
  }

  function parseCard(hash) {
    if (!hash) return { empty: true };
    var frag = hash.charAt(0) === "#" ? hash.slice(1) : hash;
    if (!frag) return { empty: true };
    var payload = frag.indexOf("1.") === 0 ? frag.slice(2) : frag;
    try {
      return { card: JSON.parse(decodeBase64URL(payload)) };
    } catch (e) {
      return { error: true };
    }
  }

  function telHref(phone) {
    var cleaned = String(phone || "").replace(/[^\d+]/g, "");
    return cleaned ? "tel:" + cleaned : "";
  }

  function renderIdle() {
    app.className = "wrap idle";
    app.innerHTML = "";
    var hero = el("header", "hero");
    hero.appendChild(el("div", "kicker", "PillPal · 藥伴伴"));
    var title = el("h1", null, "Medical Card");
    title.appendChild(el("small", null, "醫療卡"));
    hero.appendChild(title);
    app.appendChild(hero);
    var card = el("div", "card");
    card.appendChild(el("p", null, "This page shows a PillPal Medical Card from a QR code. Scan the QR on someone’s phone to open their selected details."));
    card.appendChild(el("p", null, "此頁面會顯示從 QR 掃描到的藥伴伴醫療卡。請掃描對方手機上的 QR，即可查看其選擇分享的資料。"));
    card.appendChild(el("p", null, "Medical details stay inside the QR fragment and are not stored on this website."));
    card.appendChild(el("p", null, "醫療資料只存在 QR 的網址片段中，本網站不會儲存。"));
    app.appendChild(card);
  }

  function renderError() {
    app.className = "wrap idle";
    app.innerHTML = "";
    var hero = el("header", "hero");
    hero.appendChild(el("h1", null, "Could not read this card"));
    app.appendChild(hero);
    var card = el("div", "card err");
    card.appendChild(el("p", null, "This QR is not a valid PillPal Medical Card. Ask the person to open Medical Card and turn the QR on again."));
    card.appendChild(el("p", null, "無法讀取此醫療卡。請對方重新開啟醫療卡並再次顯示 QR。"));
    app.appendChild(card);
  }

  function renderCard(card) {
    app.className = "wrap";
    app.innerHTML = "";

    var hero = el("header", "hero");
    hero.appendChild(el("div", "kicker", "Emergency reference · 緊急參考"));
    var title = el("h1", null, "PillPal Medical Card");
    title.appendChild(el("small", null, "藥伴伴醫療卡"));
    hero.appendChild(title);
    var disc = el("p", "disclaimer");
    disc.appendChild(document.createTextNode("This is not an official medical ID. For personal reference only."));
    disc.appendChild(el("br"));
    disc.appendChild(document.createTextNode("這不是正式醫療證件，僅供個人參考。"));
    hero.appendChild(disc);
    app.appendChild(hero);

    var box = el("div", "card");
    var hasAny = false;

    if (Object.prototype.hasOwnProperty.call(card, "n")) {
      hasAny = true;
      var name = String(card.n || "").trim();
      box.appendChild(section("Name", "姓名", el("div", "val", name || "Me · 我")));
    }

    if (Object.prototype.hasOwnProperty.call(card, "a")) {
      hasAny = true;
      var allergies = String(card.a || "").trim();
      var allergyNode = allergies ? el("div", "val", allergies) : emptyValue();
      box.appendChild(section("Allergies", "過敏", allergyNode, allergies ? "warn" : ""));
    }

    if (Object.prototype.hasOwnProperty.call(card, "i")) {
      hasAny = true;
      var ice = card.i || {};
      var iceName = String(ice.n || "").trim();
      var iceRel = String(ice.r || "").trim();
      var icePhone = String(ice.p || "").trim();
      var iceWrap = el("div", "val");
      if (!iceName && !iceRel && !icePhone) {
        box.appendChild(section("Emergency Contact", "緊急聯絡人", emptyValue()));
      } else {
        if (iceName) iceWrap.appendChild(el("div", null, iceName));
        if (iceRel) iceWrap.appendChild(el("div", "sub", iceRel));
        if (icePhone) {
          var href = telHref(icePhone);
          if (href) {
            var link = el("a", "phone sub", icePhone);
            link.href = href;
            iceWrap.appendChild(link);
          } else {
            iceWrap.appendChild(el("div", "sub", icePhone));
          }
        }
        box.appendChild(section("Emergency Contact", "緊急聯絡人", iceWrap));
      }
    }

    if (Object.prototype.hasOwnProperty.call(card, "m")) {
      hasAny = true;
      var meds = Array.isArray(card.m) ? card.m : [];
      var list = el("div", "val");
      if (!meds.length) {
        box.appendChild(section("Current Medications", "目前藥物", emptyValue()));
      } else {
        meds.forEach(function (med) {
          var row = el("div", "med");
          row.appendChild(el("strong", null, String((med && med.n) || "").trim() || "—"));
          var dose = String((med && med.d) || "").trim();
          if (dose) row.appendChild(el("span", null, dose));
          list.appendChild(row);
        });
        if (card.x > 0) {
          var more = el("div", "sub");
          more.textContent = "…" + card.x + " more not shown · 另有 " + card.x + " 項未顯示";
          list.appendChild(more);
        }
        box.appendChild(section("Current Medications", "目前藥物", list));
      }
    }

    if (!hasAny) {
      renderIdle();
      return;
    }

    app.appendChild(box);
    var note = el("p", "note");
    note.textContent = "Generated on a personal iPhone. Details stay in this QR and are not stored on a server. · 由個人 iPhone 產生。資料留在此 QR 內，不會儲存在伺服器。";
    app.appendChild(note);
  }

  function render() {
    var parsed = parseCard(location.hash);
    if (parsed.empty) renderIdle();
    else if (parsed.error) renderError();
    else renderCard(parsed.card || {});
  }

  window.addEventListener("hashchange", render);
  render();
})();
  </script>
</body>
</html>
